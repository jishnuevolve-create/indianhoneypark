# Builds the website and publishes it to GitHub Pages on every push to main.
# Live address: https://jishnuevolve-create.github.io/indianhoneypark/
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # to see when GitHub's own branch publish has finished (see below)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for the /<repository-name>/ sub-folder
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages shows 404.html for addresses it doesn't know (e.g. /products/kashmir-honey).
      # Making it a copy of the app lets the app open the right page instead.
      - name: Support direct links to inner pages
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings -> Pages -> Source is still "Deploy from a branch", GitHub also runs
      # its own "pages build and deployment", which publishes the raw (unbuilt) files.
      # Whichever publish finishes last stays live, so wait for that run to finish first
      # and then publish the real website. Once the source is "GitHub Actions", that run
      # no longer exists and this step finishes after about 30 seconds.
      - name: Wait for GitHub's own branch publish to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "none"')
            echo "GitHub branch publish: $status"
            if [ "$status" = "completed" ]; then break; fi
            if [ "$status" = "none" ] && [ "$attempt" -ge 3 ]; then break; fi
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4
